# Acme Corp accounts-payable policy: machine-readable values.
# Human-readable policy: docs/AP_POLICY.md (section numbers referenced below as §n).
#
# The AP agents load this file at startup (override the path with AP_POLICY_FILE).
# Keys marked [enforced] change agent behaviour. Keys marked [documented] record the policy
# for humans and for future automation; changing them doesn't change behaviour yet.
# Environment variables (e.g. VP_REVIEW_THRESHOLD) still override these values, for experiments.

policy:
  id: FIN-AP-001
  version: "1.0"
  effective_date: null        # YYYY-MM-DD once approved
  owner: Controller, Finance
  approved_by: null           # CFO name, date

currency:
  base: USD                                   # [enforced] §11
  reference_rates_to_usd:                     # [enforced] §11 treasury reference rates; others are rejected. PLACEHOLDER rates, not live
    USD: 1.0
    EUR: 1.08
    GBP: 1.27
    CAD: 0.73

approval:                                     # §4
  vp_review_threshold: 10000                  # [enforced] at or above: VP-level scrutiny
  cfo_threshold: 50000                        # [enforced] at or above: never auto-approved
  approver_limits:                            # [enforced] §2 the most each role may approve (USD); null = unlimited
    ap_specialist: 10000
    department_approver: 10000
    vp_finance: 50000
    cfo: null

human_review:                                 # §4.3, §15 [enforced]
  two_person_approval_at: 50000               # at or above: two different people must approve before payment
  two_person_for_codes:                       # these findings need two approvers whatever the amount
    - BANK_DETAILS_CHANGED
    - VENDOR_ADDRESS_MISMATCH
  senior_roles: [vp_finance, cfo]             # a two-person approval must include one of these
  # Who may act as a reviewer, and in which role. When this list is non-empty, a name not on it can't
  # approve, reject, hold or reopen, and nobody can pick a role other than their own.
  # (The prototype has no login; in production this comes from SSO / the HR system.)
  # PLACEHOLDER names - replace with Acme's real approvers.
  reviewers:
    - {name: Dana Lee, role: vp_finance}
    - {name: Raj Mehta, role: vp_finance}
    - {name: Sam Patel, role: cfo}
    - {name: Ann Kim, role: ap_specialist}
    - {name: Bo Chen, role: department_approver}
  override:                                   # reopening a REJECTED invoice is a policy exception
    approvals_required: 2
    required_role: cfo                        # one of the approvers must be the CFO
    not_overridable:                          # never payable, even by humans
      - DUPLICATE_INVOICE
      - PROMPT_INJECTION

anti_splitting:                               # [enforced] §4.4
  window_days: 3
  min_share_of_vp_threshold: 0.5              # only invoices >= 50% of the VP threshold count

matching:                                     # §5
  price_variance_tolerance: 0.10              # [enforced] unit price above catalog by more than this is a warning
  money_tolerance: 0.01                       # [documented] arithmetic tolerance (fixed in code today)
  tax_tolerance: 0.05                         # [documented] tax reconciliation tolerance (fixed in code today)
  po_required_above: 2500                     # [documented]
  three_way_match_for_goods: true             # [documented] planned for agents
  quantity_tolerance_vs_receipt: 0.0          # [documented]
  freight_tolerance_share_of_goods: 0.05      # [enforced] shipping above this share of the goods value is a warning
  max_tax_rate: 0.15                          # [enforced] tax above this share of the subtotal (stated or implied) needs a human
  non_po_categories:                          # [documented]
    - utilities
    - rent
    - taxes_and_regulatory_fees
    - legal_settlements
    - contracted_subscriptions

terms:
  due_date_tolerance_days: 3                  # [enforced] §3 due date vs "Net N" terms

# §6: warnings that always need a human, whatever the amount. [enforced]
# Remove an entry to let the reviewer decide; add a check's code to force escalation.
always_escalate:
  BANK_DETAILS_CHANGED: a request to pay new bank details must be verified out-of-band before any payment
  VENDOR_ADDRESS_MISMATCH: a changed remit address is a classic payment-redirection fraud pattern
  VENDOR_NAME_VARIANT: a look-alike vendor name must be confirmed as the same legal entity
  UNKNOWN_VENDOR: first payment to a vendor not in the vendor master needs onboarding/KYC
  FOREIGN_CURRENCY: foreign-currency invoices need treasury to confirm the FX rate
  REVISED_INVOICE: a revision of an invoice we already acted on needs AP to reconcile against the PO
  INVOICE_NUMBER_COLLISION: an invoice number reused by a different vendor needs investigation
  THRESHOLD_SPLITTING: near-threshold invoices from one vendor within days may be split to dodge VP review
  EXTRACTION_UNVERIFIED: the extracted data could not be verified against the document - a human must check it
  MISSING_INVOICE_NUMBER: without an invoice number duplicates can't be detected reliably
  TAX_RATE_UNUSUAL: tax far above normal rates is a way to overcharge through the tax line
  FREIGHT_ABOVE_TOLERANCE: freight far above the usual share of the goods value is a way to overcharge

payments:                                     # §12
  single_payment_limit: 50000                 # [enforced] USD; declined at the bank boundary above this
  dual_approved_payment_limit: 250000         # [enforced] USD; payments approved by two people may go up to this
  default_method: ACH                         # [documented]
  wire_allowed_above: 100000                  # [documented]
  forbidden_methods: [gift_card, crypto, personal_account]   # [documented] flagged by fraud checks today
  payment_runs_per_week: 2                    # [documented]
  take_early_discount_if_annualised_return_above: 0.08      # [documented] cost of capital
  late_fee_escalation_amount: 500             # [documented]

vendor_master:                                # §7 [documented]
  bank_change_cooling_off_business_days: 5
  dormant_after_months: 18
  annual_review_top_n_by_spend: 50

special_invoice_types:                        # §9 [documented]
  proforma: never_pay
  credit_note: apply_to_open_invoices
  recurring_variance_tolerance: 0.05
  prepayment_cfo_approval_above: 25000

automation:                                   # §14
  max_extraction_attempts: 3                  # [enforced]
  max_review_rounds: 3                        # [enforced]
  fast_path: true                             # [enforced] skip LLM deliberation when only one outcome is allowed
  precedent_min_approvals: 2                  # [enforced] consistent human approvals before a warning auto-resolves
  model_change_gate:                          # [documented]
    min_decision_accuracy: 1.0
    max_wrongly_paid: 0

service_levels:                               # §15 [documented]
  escalation_review_business_days: 2
  escalation_reminder_days: 2
  escalation_bump_days: 4

records:                                      # §17 [documented]
  retention_years: 7
  quarterly_audit_sample_auto_approved: 25
  quarterly_audit_sample_escalated: 25
